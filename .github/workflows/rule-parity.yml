name: Rule parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source syntax and every generated artifact (read-only)
        run: python3 scripts/build-rules.py --check
      - name: Test compatibility, priorities and generation guards
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
